      "text": "<style type=\"text/css\">/* ======================== */\n/* THEME COLORS + SETTINGS  */\n/* ======================== */\n:root {\n  --gsac-green: #0c6644;\n  --gsac-gold: #dfbb9a;\n  --dark-green: #083d29;\n  --text-light: #ffffff;\n  --radius-lg: 18px;\n  --radius-md: 10px;\n  --transition: 0.3s ease-in-out;\n  --bg-deep-1: #083d29;\n  --bg-deep-2: #0c6644;\n  --bg-deep-3: #145f3e;\n}\n\n/* ======================== */\n/* BACKGROUND ANIMATIONS    */\n/* ======================== */\n@keyframes bgShift {\n  0% { background-position: 0% 50%; }\n  50% { background-position: 100% 50%; }\n  100% { background-position: 0% 50%; }\n}\n\n@keyframes confetti {\n  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }\n  100% { transform: translateY(200vh) rotate(360deg); opacity: 0; }\n}\n\n/* ======================== */\n/* RIBBON ANIMATIONS        */\n/* ======================== */\n/* metallic sweep across ribbon */\n@keyframes ribbonShine {\n  0%, 85% { background-position: 0% 50%; }\n  92% { background-position: 100% 50%; }\n  100% { background-position: 0% 50%; }\n}\n\n/* glow pulse in reflection below ribbon */\n@keyframes ribbonGlowPulse {\n  0%, 80% {\n    opacity: 0.4;\n    filter: blur(18px);\n  }\n  92% {\n    opacity: 0.8;\n    filter: blur(14px);\n  }\n  100% {\n    opacity: 0.4;\n    filter: blur(18px);\n  }\n}\n\n/* ======================== */\n/* WRAPPER / HERO BLOCK     */\n/* ======================== */\n.gsac-wrapper {\n  position: relative;\n  overflow: hidden;\n  background: linear-gradient(135deg, var(--bg-deep-1), var(--bg-deep-2), var(--bg-deep-3));\n  background-size: 200% 200%;\n  animation: bgShift 15s ease infinite;\n  padding: 5rem 1rem 4rem; /* note: extra top padding for ribbon */\n  text-align: center;\n  font-family: \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n  color: var(--text-light);\n  border-radius: var(--radius-lg);\n  box-shadow: 0 0 30px rgba(0,0,0,0.6) inset;\n}\n\n/* faint gold radial glow over bg */\n.gsac-wrapper::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: radial-gradient(circle at 50% 20%, rgba(223,187,154,0.15), transparent 70%);\n  pointer-events: none;\n  z-index: 0;\n}\n\n/* drifting sparkle/confetti layer */\n.gsac-wrapper::after {\n  content: \"\";\n  position: absolute;\n  top: -200px;\n  left: 0;\n  width: 100%;\n  height: 200%;\n  background-image:\n    radial-gradient(rgba(223,187,154,0.3) 1px, transparent 1px),\n    radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px);\n  background-size: 40px 40px, 60px 60px;\n  animation: confetti 40s linear infinite;\n  z-index: 0;\n  opacity: 0.25;\n  pointer-events: none;\n}\n\n/* ======================== */\n/* RIBBON (CONFERENCE ID)   */\n/* ======================== */\n.gsac-ribbon {\n  position: absolute;\n  top: 1rem;\n  left: 50%;\n  transform: translateX(-50%) skewX(-8deg);\n  background: linear-gradient(\n    110deg,\n    #0c6644 0%,\n    #0c6644 10%,\n    #267254 25%,\n    #cfa66a 45%,\n    #dfbb9a 50%,\n    #cfa66a 55%,\n    #267254 75%,\n    #0c6644 90%,\n    #0c6644 100%\n  );\n  background-size: 250% 250%;\n  animation: ribbonShine 12s ease-in-out infinite;\n  border: 2px solid var(--gsac-gold);\n  box-shadow:\n    0 6px 18px rgba(0,0,0,0.5),\n    0 0 12px rgba(223,187,154,0.4),\n    0 0 40px rgba(223,187,154,0.25);\n  border-radius: 6px;\n  padding: 0.6rem 1rem;\n  min-width: 260px;\n  max-width: 90%;\n  z-index: 5;\n  overflow: hidden;\n}\n\n/* darker overlay so text is always readable */\n.gsac-ribbon::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.2));\n  mix-blend-mode: multiply;\n  border-radius: 6px;\n  pointer-events: none;\n}\n\n/* glow reflection cast down onto the hero */\n.gsac-ribbon::before {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  top: 100%;\n  transform: translateX(-50%);\n  width: 160%;\n  height: 60px;\n  background: radial-gradient(\n    ellipse at center,\n    rgba(223,187,154,0.6) 0%,\n    rgba(223,187,154,0.2) 35%,\n    transparent 80%\n  );\n  filter: blur(18px);\n  opacity: 0.4;\n  pointer-events: none;\n  z-index: -1;\n  animation: ribbonGlowPulse 12s ease-in-out infinite;\n}\n\n.gsac-ribbon-text {\n  transform: skewX(8deg);\n  font-size: 0.7rem;\n  line-height: 1.3;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  text-align: center;\n  color: #fff;\n  text-shadow:\n    0 2px 4px rgba(0,0,0,0.8),\n    0 0 6px rgba(0,0,0,0.6);\n  position: relative;\n  z-index: 2;\n}\n\n.gsac-ribbon-text span {\n  color: var(--gsac-gold);\n  text-shadow:\n    0 0 6px rgba(223,187,154,0.9),\n    0 0 12px rgba(223,187,154,0.7);\n  font-weight: 800;\n}\n\n/* ======================== */\n/* HEADER CONTENT           */\n/* ======================== */\n.gsac-header {\n  position: relative;\n  z-index: 2;\n  margin-bottom: 2.5rem;\n  text-align: center;\n}\n\n.gsac-pretitle {\n  font-size: 0.8rem;\n  letter-spacing: 0.2em;\n  color: var(--gsac-gold);\n  text-transform: uppercase;\n  margin-bottom: 0.5rem;\n  font-weight: 600;\n}\n\n.gsac-title {\n  font-size: 2.2rem;\n  font-weight: 800;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  display: inline-block;\n  background: linear-gradient(90deg, var(--gsac-gold), #ffffff, var(--gsac-gold));\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  margin: 0;\n  position: relative;\n}\n\n.gsac-subtitle {\n  color: #e5e5e5;\n  font-size: 0.95rem;\n  margin-top: 1.2rem;\n  line-height: 1.4;\n}\n\n/* ======================== */\n/* GRID OF CHAMPIONSHIPS    */\n/* ======================== */\n.gsac-grid {\n  position: relative;\n  z-index: 2;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 1.5rem;\n}\n\n/* individual championship card */\n.gsac-card {\n  position: relative;\n  width: 220px;\n  padding: 1.2rem 1rem 1.5rem;\n  border-radius: var(--radius-lg);\n  background: linear-gradient(\n    160deg,\n    rgba(12,102,68,0.9) 0%,\n    rgba(18,73,48,0.95) 80%\n  );\n  border: 2px solid var(--gsac-gold);\n  box-shadow:\n    0 0 15px rgba(223,187,154,0.4),\n    0 20px 30px rgba(0,0,0,0.6);\n  overflow: hidden;\n  transition: transform var(--transition), box-shadow var(--transition);\n}\n\n/* thin gold highlight bar up top */\n.gsac-card::before {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  left: 0;\n  height: 5px;\n  width: 100%;\n  background: linear-gradient(\n    90deg,\n    var(--gsac-gold) 0%,\n    #ffffff 50%,\n    var(--gsac-gold) 100%\n  );\n  border-top-left-radius: var(--radius-lg);\n  border-top-right-radius: var(--radius-lg);\n}\n\n/* hover lift, glow, and presence */\n.gsac-card:hover {\n  transform: translateY(-6px) scale(1.03);\n  box-shadow:\n    0 0 25px rgba(223,187,154,0.9),\n    0 30px 40px rgba(0,0,0,0.8);\n}\n\n/* passing shimmer sweep on hover */\n.gsac-card::after {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  left: -75%;\n  width: 50%;\n  height: 100%;\n  background: linear-gradient(\n    120deg,\n    transparent,\n    rgba(255,255,255,0.3),\n    transparent\n  );\n  transform: skewX(-25deg);\n  transition: 0.5s;\n  pointer-events: none;\n}\n.gsac-card:hover::after {\n  left: 125%;\n  transition: 0.8s;\n}\n\n/* card link content */\n.gsac-card a {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  text-decoration: none;\n  color: inherit;\n  position: relative;\n  z-index: 2;\n}\n\n/* logo wrapper */\n.gsac-logo-wrapper {\n  background: rgba(255,255,255,0.1);\n  border-radius: var(--radius-md);\n  padding: 0.8rem;\n  margin-bottom: 0.7rem;\n  box-shadow: 0 10px 20px rgba(0,0,0,0.6);\n}\n\n.gsac-logo-wrapper img {\n  max-width: 100%;\n  height: auto;\n  display: block;\n  filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));\n}\n\n/* small badge under the logo */\n.gsac-badge {\n  font-size: 0.65rem;\n  letter-spacing: 0.15em;\n  color: var(--gsac-gold);\n  border: 1px solid var(--gsac-gold);\n  background: rgba(223,187,154,0.1);\n  border-radius: var(--radius-md);\n  padding: 0.35rem 0.6rem;\n  margin-bottom: 0.5rem;\n  text-transform: uppercase;\n  font-weight: 700;\n  text-shadow: 0 0 6px rgba(0,0,0,0.8);\n  box-shadow:\n    0 8px 16px rgba(0,0,0,0.7),\n    0 0 12px rgba(223,187,154,0.4);\n}\n\n/* sport title */\n.gsac-card-title {\n  font-size: 0.9rem;\n  font-weight: 600;\n  text-transform: uppercase;\n  color: var(--text-light);\n  letter-spacing: 0.07em;\n  text-shadow:\n    0 0 6px rgba(0,0,0,0.8),\n    0 0 12px rgba(0,0,0,0.8);\n  margin: 0;\n}\n\n/* ======================== */\n/* RESPONSIVE               */\n/* ======================== */\n@media (max-width: 520px) {\n  .gsac-card {\n    width: 45%;\n    min-width: 150px;\n  }\n  .gsac-title {\n    font-size: 1.6rem;\n  }\n  .gsac-ribbon {\n    min-width: 220px;\n    padding: 0.5rem 0.75rem;\n  }\n  .gsac-ribbon-text {\n    font-size: 0.6rem;\n    letter-spacing: 0.16em;\n  }\n}\n\n/* 2026 restrained visual refresh */\n.gsac-wrapper {animation-duration:28s;padding-bottom:3rem;box-shadow:inset 0 0 24px rgba(0,0,0,.28)}\n.gsac-wrapper::after {opacity:.10;animation-duration:95s}\n.gsac-ribbon {animation-duration:22s;box-shadow:0 5px 15px rgba(0,0,0,.28)}\n.gsac-ribbon::before {animation-duration:22s;opacity:.22}\n.gsac-header {margin-bottom:2.1rem}\n.gsac-title {font-size:clamp(1.65rem,4vw,2.65rem);letter-spacing:.025em}\n.gsac-subtitle {margin-top:.7rem}.gsac-subtitle-detail {color:#d9e8de;font-size:.83rem}\n.gsac-grid {gap:1.15rem}\n.gsac-card {box-sizing:border-box;width:220px;padding:1rem .85rem 1.25rem;background:linear-gradient(160deg,rgba(15,93,62,.93),rgba(9,61,42,.96));border:1px solid rgba(223,187,154,.7);box-shadow:0 8px 19px rgba(0,0,0,.25);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}\n.gsac-card:hover {transform:translateY(-3px);border-color:var(--gsac-gold);box-shadow:0 11px 25px rgba(0,0,0,.3),0 0 10px rgba(223,187,154,.22)}\n.gsac-logo-wrapper
