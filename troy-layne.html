set=\"utf-8\">\u003C\u002Fscript>\r\n\u003Ch1>\u003Cspan style=\"font-family:tahoma;\">\u003Cstrong>The Meade File\u003C\u002Fstrong>\u003C\u002Fspan>\u003C\u002Fh1>\r\n\r\n\u003Ctable class=\"sidearm-table g-mb-20\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Personal Information\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Birthday\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>September 10\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Hometown\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville, Ky. \u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Education\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville, 2007 (Bachelor's)\u003Cbr \u002F>\r\n\t\t\tEastern Illinois, 2009 (Master's)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Playing Career\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville, 2003-07\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Wife\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Jesse\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Children\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Kasen and Mikah\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n \r\n\r\n\u003Ctable class=\"sidearm-table\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Coaching History\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2022-Present\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy -\u003Cbr \u002F>\r\n\t\t\tHead Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>South Carolina -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach \u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2015-17\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Michigan State -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2013-14\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Middle Tennessee State - \u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2009-2012\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Eastern Illinois -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2008\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Eastern Illinois -\u003Cbr \u002F>\r\n\t\t\tGraduate Assistant\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"text-align: justify;\">\r\n\u003Cp dir=\"ltr\">Skylar Meade enters his fifth season as Troy's head coach in 2026, following a 2025 campaign that saw the Trojans achieve a No. 14 national ranking, the highest in program history.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nThe Trojans have accumulated 148 wins during Meade’s tenure, the most wins in the first four seasons by a head coach in program history. Troy is coming off three consecutive 37-plus win seasons for the first time since 1996-98.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade took over Troy’s head coaching role in 2022 following four seasons as the pitching coach at South Carolina. \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">\u003Cb id=\"docs-internal-guid-33c7f7b2-7fff-0f75-eb31-fc508ed732f8\">2025\u003C\u002Fb>\u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Meade’s fourth season began with a No. 25 national ranking, marking the first time the program had received a preseason ranking. With a 39-21 record, Troy was ranked each week from the preseason through Week 14, the longest stretch in the program’s Division-I history that the Trojans have been ranked. Additionally, Troy was the only team in college baseball to win each of its first 13 weekend series. The Trojans defeated national runner-up Coastal Carolina in a three-game set and added a marquee win on the road at No. 15 Mississippi State.\u003Cb> \u003C\u002Fb>\u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Troy finished third in the Sun Belt Conference with an 18-12 record, boasting one of the league's most potent offenses. The Trojans ranked second in the Sun Belt in on-base percentage (.403) and walks (323) and fourth in runs per game (7.0) and OPS (.837). Additionally, the Trojans set a school record for hit-by-pitch (122) and were the only team in college baseball to finish the regular season in the top 20 nationally for both walks and hit-by-pitch. \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Individually, Troy placed three players on the Sun Belt All-Conference teams, with first baseman Blake Cavill leading the way on the first team and catcher Brooks Bryan and starting pitcher Garrett Gainous landing on the second team. \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Cavill made an impression on the Troy record book, ranking third nationally in walks (65), which tied Jorge Soto in 1999 for the most in program history. Cavill’s .516 on-base percentage was 13th nationally and the second-best by a Trojan in the program’s Division-I era. Additionally, Steven Meier drew a Troy record 29 hit-by-pitches.\u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">On the mound, Garrett Gainous and Grayson Stewart became the newest members of the 250-strikeout club. Gainous finished his playing career ranked third in Troy history for strikeouts (262) with Stewart finishing his career ranked fifth (251). Reliever Jay Dill led the team with 70 strikeouts and posted a Sun Belt-best 12.86 strikeouts per nine innings. \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Under Meade's leadership, Troy saw five players earn opportunities in professional baseball, its most since 2007. Brooks Bryan (8th round - Kansas City Royals), Noah Edders (15th round - Chicago Cubs) and Jay Dill (18th round - Athletics) were each selected in the MLB Draft, while Adam Falinski (Minnesota Twins) and Coby Frieda (New York Mets) struck free agent deals. \u003C\u002Fp>\r\n \r\n\r\n\u003Cp dir=\"ltr\">\u003Cb id=\"docs-internal-guid-33c7f7b2-7fff-0f75-eb31-fc508ed732f8\">2024\u003C\u002Fb>\u003Cbr \u002F>\r\nMeade’s third season saw the Troy program reach new heights with a No. 21 national ranking, its highest since 2013. With a 37-22 record in 2024, Meade's 109 career wins are the most-ever in the first three seasons by a Troy head coach. In addition, the Trojans won 77 games across the 2023 and 2024 seasons, which were Troy's most in a two-year span since 2006-07.  \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">The Trojans were one of the most prolific offenses in the Sun Belt Conference in 2024, drawing a school record 382 walks to rank third nationally while leading the conference and ranking eighth in the country with a .424 on-base percentage. Additionally, the Trojans scored 516 runs on the season, which were the second most in the Sun Belt and 14th in the nation.  \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">The 2024 season saw the Trojans rack up numerous key wins, winning nine games against teams that made the NCAA Tournament. The Trojans earned series victories at Indiana and against No. 18 Louisiana while sweeping No. 13 Coastal Carolina on the road to go along with wins at Southern Miss and against James Madison. Troy finished the regular season as the No. 3 seed in the SBC Tournament. \u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Under Meade’s leadership, Brooks Bryan rewrote the Troy record books with a school-record 85 RBIs. Bryan was a Golden Spikes Award semifinalist, Dick Howser Trophy semifinalist, All-Sun Belt First Team and ABCA All-Region First Team while being selected to compete on the USA Baseball Collegiate National Team\u003Cb>. \u003C\u002Fb>\u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Troy's six selections on the Sun Belt All-Conference teams were the most in the league. Bryan was named to the First Team while Luke Lyon, Will Butcher, Ethan Kavanagh, Kole Myers and Kyle Mock were all named to the Second Team. \u003Cb> \u003C\u002Fb>\u003C\u002Fp>\r\n\r\n\u003Cp dir=\"ltr\">Myers heard his name called by the Los Angeles Dodgers in the ninth round of the 2024 MLB Draft by the Los Angeles Dodgers, while Clete Hartzog signed a free agent deal with the Chicago White Sox. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nFollowing the 2024 season, Meade was selected to serve as the pitching coach for the USA Baseball Collegiate National Team Friendship Series, where he helped lead Team USA to a five-game sweep of Chinese Taipei. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cb> \u003Cbr \u002F>\r\n2023\u003C\u002Fb>\u003Cbr \u002F>\r\nSkylar Meade’s second season saw the Trojans skyrocket beyond expectations as he led the program to its first 40-win seasons since 2018 and fifth in the last 20 years. He also led the Trojans to an at-large berth in the NCAA Tuscaloosa Regional, where they defeated Boston College, 11-10, in the Regional opener. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade and the Trojans dominated on the mound leading the Sun Belt Conference and ranking 11th in the country in strikeouts per nine innings at 10.6 – the second straight season where the Trojans set a program record. On the offensive side, Troy recorded 19 triples to lead the league and rank 20th in the nation. Additionally, Troy ranked in the top three in walks (third – 306), double plays (second – 51), double plays per game (third – 0.82), home runs (second – 108), home runs per game (third – 1.74), runs (second – 476), triples per game (second – 0.31).\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nThe 2023 season saw key victories by Meade and the Trojans, including his first win over an SEC opponent at Auburn, in addition to series sweeps over Marshall, ULM, USC-Upstate, Stony Brook and Evansville. Under the guidance of Meade, the Trojans entered the SBC Tournament as the No. 3 seed.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade's leadership also propelled two players, Zach Fruit (Baltimore Orioles) and William Sullivan (St. Louis Cardinals), to be selected in the MLB Draft, while Caleb Bartolero and Ben Thompson signed with the Los Angeles Angels. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nShane Lewis earned Sun Belt Player and Newcomer of the Year honors after hitting a program record 27 home runs. Lewis was a Dick Howser Trophy semifinalist, All-Sun Belt First Team, Collegiate Baseball All-American Third Team and ABCA \u002F Rawlings All-American Third Team. Troy raked in the accolades with three All-Sun Belt First Team selections (Lewis, Caleb Bartolero, Grayson Stewart) and one second team (Noah Manning).\u003Cbr \u002F>\r\n\u003Cb> \u003Cbr \u002F>\r\n2022\u003C\u002Fb>\u003Cbr \u002F>\r\nIn his first season at the helm of the Trojans, Meade led Troy to a 32-win season and an appearance in the semifinals of the Sun Belt Conference Tournament. The 32 wins in 2022 were the most by a Trojan team since 2019. Under the pitching expertise of Meade, the Trojans led the Sun Belt Conference in strikeouts, totaling 520. In addition, they led the conference in strikeouts per nine innings at 9.5, which was the most in program history, as Meade has now been a part of a strikeout record at every program he's coached at. Meade became the fourth coach in program history to win at least 30 games in his first season. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade earned his first win as head coach of the Trojans on Feb. 18, 2022, in a 2-1 win over Holy Cross. More history was made when Meade led the Trojans to their first-ever sweep over Louisiana and swept Big Ten program, Indiana. The Trojans saw a nine-game win streak during the 2022 season, which was the fourth-longest in the country at the time and the longest in program history since 2006.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nRigsby Mosley earned Sun Belt all-conference recognition for the first time in his storied career as a pitcher under the direction of Meade after five years having only played outfield.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cb>Prior to Troy\u003C\u002Fb>\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nA 14-year coaching veteran, Meade has previous stops at South Carolina, Michigan State, Middle Tennessee and Eastern Illinois following a standout playing career at Louisville, where he pitched in the College World Series. Meade has seen 35 players selected in the MLB Draft during his time as a pitching coach and as a head coach, with 14 of those players taken within the first 10 rounds.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade’s final season with South Carolina in 2021 saw six Gamecock pitchers selected in the MLB Draft, which was tied with Arkansas for the most pitchers selected from any one school. Brett Kerry earned D1 Baseball and NCBWA All-America honors while Will Sanders was named to the SEC All-Freshman Team, was a Freshman All-American selection by two organizations and was selected as a member of USA Baseball Collegiate National Team. Additionally, Jack Mahoney earned Freshman All-America honors from Perfect Game.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nThe Gamecocks posted the fourth-best ERA in the Southeastern Conference in 2021, while South Carolina's staff totaled 624 strikeouts in just 507 innings pitched. South Carolina hosted an NCAA Regional and picked up an in-season sweep of No. 5 Florida.\u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nMeade joined the South Carolina staff before the 2018 season and during his four seasons 14 Gamecock pitchers were selected in the MLB Draft. Seven of those picks came in the top 10 rounds, including Carmen Mlodzinski, who was selected by the Pittsburgh Pirates with the 31st overall pick in the 2020 MLB Draft.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nHe made an immediate impact in his first season with the Gamecocks as they held opponents to a .243 batting average and posted 542 strikeouts in 553.1 innings of work. In the shortened 2020 season, South Carolina pitchers combined for a 2.81 ERA with 184 strikeouts in just 144 innings pitched. In 2019, Kerry began his rise up the national pitching ranks under Meade's guidance as he was named to the SEC All-Freshman Team and a Freshman All-American by three different organizations.\u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nMeade joined the South Carolina staff following three seasons as the pitching coach at Michigan State. Under his watch, a Spartan pitcher led the Big Ten in ERA in each of his last two seasons on staff (Walter Borkovich in 2017; Dakota Mekkes in 2016). Additionally, the Spartans posted their top three strikeout totals in school history his final three seasons with 409 strikeouts in 2015, 466 in 2016 and 420 in 2017.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMichigan State led the Big Ten in ERA (2.75), opponent's batting average (.234) and runs allowed (199) in 2016. That ERA also was third in the nation and fifth lowest in school history. Meade helped Mekkes earn NCBWA All-America honors after finishing the season with the best strikeout per nine innings (15.16) and hits per nine innings (4.11) ratios in the nation. In his first season, Meade helped Joe Mockbee to a 1.78 ERA, the lowest by a Spartan since 1974.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nPrior to his stint at Michigan State, Meade spent two years as the pitching coach at Middle Tennessee. The Blue Raider pitching staff lowered its team ERA in each of his two seasons including posting the program's lowest mark in 13 years during his final year on staff.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nMeade also mentored Zac Curtis, who was selected in the sixth round of the MLB Draft by the Arizona Diamondbacks, and Daniel Palo, a Colorado Rockies draftee. \u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nPrior to joining the staff at Middle Tennessee, Meade spent five seasons at Eastern Illinois, first as a graduate assistant before being elevated to an assistant coach in 2009. EIU posted one of the Ohio Valley Conference's best rotations during his time at the school. The Panthers sported the best team ERA in the OVC in four of his five years - 2008, 2010, 2011 and 2012 - while finishing second in 2009.\u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nMeade helped lead the Panthers to the 2009 OVC regular season championship and the 2008 OVC Tournament title; the berth in the 2008 NCAA Tournament was just the second in school history. \u003Cbr \u002F>\r\n\u003Cb id=\"docs-internal-guid-33c7f7b2-7fff-0f75-eb31-fc508ed732f8\"> \u003C\u002Fb>\u003Cbr \u002F>\r\nDuring his tenure at EIU, Meade saw a number of his pitchers rack up All-OVC accolades in addition to being selected in the MLB Draft. In 2010, Josh Mueller was drafted in the 13th round of the MLB Draft by the Colorado Rockies. Tyler Kehrer, who led the OVC in strikeouts and opponent batting average in 2009, became the highest-drafted EIU player since 1988, as he was taken 48th overall by the Los Angeles Angels of Anaheim in Compensation Round A.\u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nMeade joined the coaching staff at EIU following his playing career at Louisville. Meade anchored a pitching staff that helped lead Louisville to an appearance in the 2007 College World Series. The southpaw recorded nine wins and limited opposing batters to a .247 average during the Cardinals' run to the College World Series, and was on the hill for the final out of the Cardinals’ victory over Mississippi State in Omaha.\u003Cbr \u002F>\r\n\u003Cb id=\"docs-internal-guid-33c7f7b2-7fff-0f75-eb31-fc508ed732f8\">  \u003C\u002Fb>\u003Cbr \u002F>\r\nA native of Louisville, Ky., Meade earned his bachelor's degree in sports administration from Louisville in 2007 and completed a master's degree in kinesiology and sports studies (sports management) in the summer of 2009 from EIU.\u003Cbr \u002F>\r\n\u003Cb> \u003C\u002Fb>\u003Cbr \u002F>\r\nMeade and his wife, Jesse, have two children, Kasen and Mikah.\u003Cbr \u002F>\r\n \u003C\u002Fp>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv class=\"sidearm-table-overflow-on-x-large\">\r\n\u003Ctable class=\"sidearm-table\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr align=\"left\">\r\n\t\t\t\u003Cth>Year\u003C\u002Fth>\r\n\t\t\t\u003Cth>School\u003C\u002Fth>\r\n\t\t\t\u003Cth>Record\u003C\u002Fth>\r\n\t\t\t\u003Cth>Conf. Record\u003C\u002Fth>\r\n\t\t\t\u003Cth>Conf. Finish\u003C\u002Fth>\r\n\t\t\t\u003Cth>Postseason\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\u003C\u002Ftbody>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2025\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>39-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>18-12\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3rd          \u003C\u002Ftd>\r\n\t\t\t\u003Ctd>SBC Tournament - Semifinals\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2024\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>37-22\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>18-12\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3rd          \u003C\u002Ftd>\r\n\t\t\t\u003Ctd>SBC Tournament - Second Round\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2023\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>40-22\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>18-12\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3rd          \u003C\u002Ftd>\r\n\t\t\t\u003Ctd>NCAA Tournament - Tuscaloosa Regional \u002F\u003Cbr \u002F>\r\n\t\t\tSBC Tournament - Second Round\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2022\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>32-24\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>15-15\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>6th ,"icon":418,"oldIcon":419},{"platformName":424,"userName":12,"url":12,"icon":422,"oldIcon":423},{"platformName":428,"userName":12,"url":12,"icon":426,"oldIcon":427},{"platformName":432,"userName":12,"url":12,"icon":430,"oldIcon":431},{"platformName":436,"userName":12,"url":12,"icon":434,"oldIcon":435},{"platformName":440,"userName":12,"url":12,"icon":438,"oldIcon":439},{"platformName":444,"userName":12,"url":12,"icon":442,"oldIcon":443},{"platformName":448,"userName":12,"url":12,"icon":446,"oldIcon":447},{"platformName":452,"userName":12,"url":12,"icon":450,"oldIcon":451},{"platformName":456,"userName":12,"url":12,"icon":454,"oldIcon":455},{"platformName":458,"userName":12,"url":12,"icon":414,"oldIcon":415},{"id":1552,"title":1553,"firstName":1554,"lastName":1555,"image":1556,"sport":1559,"positionShort":-1,"call_to_action":-1,"bio":1560,"twitter":1561,"images":12,"displayFields":1562,"latestBioId":1552,"email":1563,"phone":1564,"url":12,"staffId":1565,"socialMediaR":1566,"custom1":18,"custom2":18,"custom3":18,"custom4":18},2090,"Associate Head Coach","Ben","Wolgamot",{"altText":1555,"url":1557,"absoluteUrl":1558,"creditName":12,"mediaCaption":12,"title":1555},"\u002Fimages\u002F2021\u002F8\u002F13\u002F20210812_Baseball_Coaches_2.jpg","https:\u002F\u002Ftroytrojans.com\u002Fimages\u002F2021\u002F8\u002F13\u002F20210812_Baseball_Coaches_2.jpg",{"id":166,"title":112,"shortDisplay":163,"shortName":167,"abbrev":163,"facebookPage":-1,"globalSportGender":165,"globalSportId":166,"globalSportShortName":-1,"globalSportNameSlug":167,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Clink href=\"https:\u002F\u002Fstatic.troytrojans.com\u002Fcustompages\u002Frail-css.css\" rel=\"stylesheet\" \u002F>\r\n\u003Cdiv class=\"sidearm-common-bio-full\">\r\n\u003Cdiv class=\"right-rail\">\r\n\u003Cdiv class=\"card rounded-0\"> \r\n\u003Ch1>\u003Cspan style=\"font-family:tahoma;\">\u003Cstrong> The Wolgamot File\u003C\u002Fstrong>\u003C\u002Fspan>\u003C\u002Fh1>\r\n\r\n\u003Ctable class=\"sidearm-table g-mb-20\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Personal Information\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Birthday\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>February 26\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Hometown\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Danville, Ill.\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Education\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Purdue, 2010 (Bachelor's)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Playing Career\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Danville Area C.C., 2006-07\u003Cbr \u002F>\r\n\t\t\tPurdue, 2008-09\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Wife\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Maggie\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Children\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Beckett, Dalyn, and Quinn\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Ctable class=\"sidearm-table\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Coaching History\u003Cbr \u002F>\r\n\t\t\t \u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2025-pres.\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy  -\u003Cbr \u002F>\r\n\t\t\tAssociate Head Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2022-2024\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u002FRecruiting Coordinator\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2019-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Western Kentucky  -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2014-18\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Valparaiso -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u002FRecruiting Coordinator\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2012-13\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Eastern Illinois -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u002FRecruiting Coordinator\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2011\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Wabash College - \u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2010\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Danville Area C.C. -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"text-align: justify;\">\r\n\u003Cp lang=\"EN-US\" paraeid=\"{21080d28-8855-4f92-bdb5-492c3d502eb9}{168}\" paraid=\"695551718\" xml:lang=\"EN-US\">Ben Wolgamot was promoted to associate head coach ahead of the 2025 season and enters his fifth season with the Trojans in 2026. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nWolgamot's first season as associate head coach in 2025 saw the Trojans finish with a 39-21 record and reach a No. 14 national ranking, the highest in program history. Additionally, Troy was ranked each week from the preseason through Week 14, the longest stretch in the program’s Division-I history that the Trojans have been ranked. With Wolgamot coaching the hitters, Troy's offense boasted one of the Sun Belt's top offenses, ranking second in the conference in on-base percentage (.403) and walks (323) and fourth in runs per game (7.0) and OPS (.837). Additionally, the Trojans set a school record for hit-by-pitch (122) and were the only team in college baseball to finish the regular season in the top 20 nationally for both walks and hit-by-pitch. First baseman Blake Cavill finished on the All-Sun Belt First Team while catcher Brooks Bryan landed on the second team before being selected in the eighth round of the 2025 draft by the Kansas City Royals.\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{806d0955-028d-4617-819f-0071f3ec8751}{176}\" paraid=\"267833807\" xml:lang=\"EN-US\">In his third season at Troy, Wolgamot was named the Alabama Baseball Coaches Association Division I Assistant Coach of the Year after coaching the Trojans to a 37-win season and a third-place finish in the Sun Belt Conference. The Trojans reached a No. 21 national ranking, the program’s first since 2013, and were among the top offenses in college baseball, ranking in the top 15 nationally in walks (third – 382), on-base percentage (eighth – .424) and runs per game (14th – 8.7). Individually, the Trojans placed six players on the All-Sun Belt Teams to lead the conference while Brooks Bryan set a new Troy record with 85 RBIs along with being named to the ABCA \u002F Rawlings All-Southeast First Team, a Golden Spikes Award semifinalist, a Dick Howser Trophy semifinalist and to the USA Baseball Collegiate National Team. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nWolgamot boosted the Trojans to a historic 2023 season, where the program earned its fifth 40-plus win season in the last 20 years and the first since 2018 while advancing to NCAA Regional in Tuscaloosa, Ala. He helped coach the Trojans to the second-ranked team in the Sun Belt Conference and 18th in the nation in homers, totaling 108. Individually, he coached the Sun Belt Player and Newcomer of the Year Shane Lewis to hitting the most home runs by a Trojan in a single season at 27 – also helped him to be named a Dick Howser Trophy semifinalist, All-Sun Belt First Team, Collegiate Baseball All-American Third Team and ABCA \u002F Rawlings All-American Third Team – also coached Caleb Bartolero to All-Sun Belt First Team. \u003Cbr \u002F>\r\n   \u003Cbr \u002F>\r\nDuring his first season with the program, he coached Troy to 32 wins and an appearance in the semifinals of the Sun Belt Conference Tournament, which is the most by a Troy team since 2019. Wolgamot and Troy also managed a nine-game win streak – longest in program history since 2006 – and had the program’s first sweep over Louisiana and Big Ten program Indiana. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nBefore Troy, Wolgamot spent three seasons with Western Kentucky. The Hilltoppers posted their most conference wins (16) since 2013 and their first Conference USA Tournament victory in program history during his first season. In addition, WKU recorded its most home runs (53) and RBIs (333) since 2010, most runs (355) since 2011, most hits (542) since 2014 and best batting average (.279) since 2016. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nHe also helped lead Jake Sanford to a breakout campaign in 2019. Sanford became the first triple crown winner in Conference USA’s history while being named the league’s Player and Newcomer of the Year and earning All-American honors. Following his historic season, Sanford was drafted by the New York Yankees in the third round of the 2019 MLB Draft. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nWolgamot and the Hilltoppers were again off to a strong start offensively in 2020, opening the year with a 10-6 record while winning all four of their weekend series before the COVID-19 pandemic cut their campaign short. At the conclusion of the shortened season, WKU ranked 10th in the nation with 41 doubles. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nHe joined the WKU staff following six years as an assistant coach at Valparaiso. At Valpo, Wolgamot served as the hitting coach and recruiting coordinator for the Crusaders. In his five years, he helped the program grow into the top-offensive club in the Horizon League and then assisted in the team’s transition to the Missouri Valley Conference in 2018. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nWhile at Valpo, Scott Kapers was selected in the 17th round of the 2018 MLB Draft. He became the third-highest selection in program history and the first Crusader position player to be drafted since 2013. With Wolgamot’s help in the batter’s box, Kapers improved from a .196\u002F.278\u002F.257 hitter as a freshman to .263\u002F.354\u002F.383 as a junior. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nAdditionally, the 2016 Valpo offense produced five hitters who accrued All-Horizon League recognition following a slugfest season. Overall, the Crusaders led the conference in batting average (.288), hits per game (10.1), doubles (109) and fewest strikeouts per game (5.9).  \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nIn 2017, Valpo led the Horizon League in doubles (100) and fewest strikeouts per game (6.2). Outfielder James Stea - who slashed .290\u002F.420\u002F.475 with eight home runs, nine doubles, 21 stolen bases, 44 runs scored, 32 runs batted in and 23 times hit by pitch - was named First Team All-Horizon League. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nValpo smacked 107 doubles and 41 home runs in 2018 - each the fifth-most in program history. The Crusaders reached 100-plus doubles for the third straight season after they had posted only one such year since 2001. The 41 home runs were the most since 2002, while the team’s .404 slugging percentage was its highest since 2010. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nWith a .971 fielding percentage in 2017 followed by a .973 mark in 2018, Valpo set a program record in back-to-back seasons. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nBefore his hiring at Valpo, Wolgamot was an assistant coach and recruiting coordinator at Eastern Illinois University for the 2012 and 2013 seasons. In 2012, the Panthers ranked 12th in the country with 50 home runs in 58 games and made a run to the Ohio Valley Conference Tournament Championship game, before falling to Austin Peay in the finals. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nWolgamot’s first coaching stint was in 2011 at Wabash College, where he helped lead the Little Giants to an NCAC Championship and the first NJCAA Regional berth in school history. At Wabash College that season was NCAC Player of the Year, first baseman John Holm, who also earned NCAC Tournament MVP, First Team All-Mideast Region and Honorable Mention All-American honors. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nWolgamot earned a bachelor’s degree in Health and Fitness from Purdue University in 2010 after starring for the Boilermakers as a junior college transfer from Danville Area Community College. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nAn All-Big Ten standout at Purdue, Wolgamot slashed .368\u002F.479\u002F.458 in 50 games. In conference play, he posted an otherworldly .426\u002F.538\u002F.521 slash line. Overall, the Boilermakers went 30-15 with Wolgamot penciled in the starting lineup and 2-11 otherwise.  \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nWolgamot earned a bachelor’s degree in health and fitness from Purdue in 2010. He is married to the former Maggie Daly, and the couple have three daughters, Beckett, Dalyn and Quinn.\u003C\u002Fp>\r\n\u003C\u002Fdiv>\r\n","benwolgamot",{"staff_title":1532,"staff_email":1533,"staff_phone":1534,"staff_twitter":416},"bwolgamot@troy.edu","5945",569,[1567,1569,1570,1571,1572,1573,1574,1575,1576,1577,1578,1579],{"platformName":416,"userName":1561,"url":1568,"icon":414,"oldIcon":415},"https:\u002F\u002Ftwitter.com\u002Fbenwolgamot",{"platformName":420,"userName":12,"url":12,"icon":418,"oldIcon":419},{"platformName":424,"userName":12,"url":12,"icon":422,"oldIcon":423},{"platformName":428,"userName":12,"url":12,"icon":426,"oldIcon":427},{"platformName":432,"userName":12,"url":12,"icon":430,"oldIcon":431},{"platformName":436,"userName":12,"url":12,"icon":434,"oldIcon":435},{"platformName":440,"userName":12,"url":12,"icon":438,"oldIcon":439},{"platformName":444,"userName":12,"url":12,"icon":442,"oldIcon":443},{"platformName":448,"userName":12,"url":12,"icon":446,"oldIcon":447},{"platformName":452,"userName":12,"url":12,"icon":450,"oldIcon":451},{"platformName":456,"userName":12,"url":12,"icon":454,"oldIcon":455},{"platformName":458,"userName":12,"url":12,"icon":414,"oldIcon":415},{"id":1581,"title":1582,"firstName":1583,"lastName":1584,"image":1585,"sport":1589,"positionShort":-1,"call_to_action":-1,"bio":1590,"twitter":1586,"images":12,"displayFields":1591,"latestBioId":1581,"email":1592,"phone":1564,"url":12,"staffId":1593,"socialMediaR":1594,"custom1":18,"custom2":18,"custom3":18,"custom4":18},2093,"Director of Player Development, Analytics & Operations","Joe","Bialkoski",{"altText":1586,"url":1587,"absoluteUrl":1588,"creditName":12,"mediaCaption":12,"title":1586},"JosephBialkoski","\u002Fimages\u002F2021\u002F8\u002F13\u002F20210812_Baseball_Coaches_4.jpg","https:\u002F\u002Ftroytrojans.com\u002Fimages\u002F2021\u002F8\u002F13\u002F20210812_Baseball_Coaches_4.jpg",{"id":166,"title":112,"shortDisplay":163,"shortName":167,"abbrev":163,"facebookPage":-1,"globalSportGender":165,"globalSportId":166,"globalSportShortName":-1,"globalSportNameSlug":167,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cdiv style=\"text-align: justify;\">\r\n\u003Cp lang=\"EN-US\" paraeid=\"{2045c72f-5556-4a7d-a5e5-a45f6d71e632}{238}\" paraid=\"370507786\" xml:lang=\"EN-US\">Joe Bialkoski was promoted to Director of Player Development, Analytics and Operations ahead of the 2025 season after three years as the Director of Player Development and Analytics. In 2024, Bialkoski helped the Trojans produce 37 wins, including series victories over Indiana, No. 18 Louisiana and a sweep over No. 13 Coastal Carolina.  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{5f5e3a17-45ae-462e-a1f8-45452175100e}{171}\" paraid=\"1714440958\" xml:lang=\"EN-US\">The 2024 campaign saw the Trojans reach a No. 21 national ranking, their first since the 2013 season, along with leading the Sun Belt Conference with six players on the All-Conference Teams. Bialkoski provided analytics for one of the top offenses in college baseball, ranking in the top 15 nationally in walks (third – 382), on-base percentage (eighth – .424) and runs per game (14th – 8.7).  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{230f84e7-2600-4c69-8118-fda8ff46f4cc}{70}\" paraid=\"738692707\" xml:lang=\"EN-US\">Bialkoski assisted in Troy’s 40-win 2023 campaign, which saw the Trojans appear in the NCAA Regional in Tuscaloosa, Ala., where they won the first game over Boston College 11-10. Before that, the Trojans were the No. 3 seed and advanced to the quarterfinals on a walk-off win over App State. He also boosted Troy to rank in the top-3 in triples (first – 19),base-on-balls (third – 306), double plays (second – 51), double plays per game (third – 0.82), home runs (second – 108), home runs per game (third – 1.74), runs (second – 476) and triples per game (second – 0.31). \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nDuring his first season, Bialkoski provided the analytics to help Troy win 32 games, including nine straight – marked the longest since 2006. He also coached Troy to rank first in the conference in strikeouts per nine innings at 9.4. That season also included a sweep over Big Ten opponent Indiana and SBC opponent Louisiana. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nBialkoski joined the Troy staff following four years at Virginia, where he served as a baseball operations assistant. The Cavaliers advanced to the College World Series in 2021 for the first time since 2015. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nBefore joining the Virginia staff, Bialkoski served as the director of baseball operations at North Florida from 2016-17. As an undergraduate, he was a student manager for both the men’s basketball and baseball programs at UNF. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nHe spent the summer of 2017 with the Hyannis Harbor Hawks of the Cape Cod League as an MLB Scout Liaison. He has held internships with the Jacksonville Suns (AA-Miami Marlins) and the Drayton Florence 7v7 Football Tournament. \u003Cbr \u002F>\r\n  \u003Cbr \u002F>\r\nBialkoski earned his bachelor’s degree in sport management from North Florida in 2017. He is married to the former Victoria Ekeli and the couple has have two sons, Vincent and Braxton.\u003C\u002Fp>\r\n\u003C\u002Fdiv>\r\n",{"staff_title":1532,"staff_email":1533,"staff_phone":1534,"staff_twitter":416},"jbialkoski@troy.edu",571,[1595,1597,1598,1599,1600,1601,1602,1603,1604,1605,1606,1607],{"platformName":416,"userName":1586,"url":1596,"icon":414,"oldIcon":415},"https:\u002F\u002Ftwitter.com\u002FJosephBialkoski",{"platformName":420,"userName":12,"url":12,"icon":418,"oldIcon":419},{"platformName":424,"userName":12,"url":12,"icon":422,"oldIcon":423},{"platformName":428,"userName":12,"url":12,"icon":426,"oldIcon":427},{"platformName":432,"userName":12,"url":12,"icon":430,"oldIcon":431},{"platformName":436,"userName":12,"url":12,"icon":434,"oldIcon":435},{"platformName":440,"userName":12,"url":12,"icon":438,"oldIcon":439},{"platformName":444,"userName":12,"url":12,"icon":442,"oldIcon":443},{"platformName":448,"userName":12,"url":12,"icon":446,"oldIcon":447},{"platformName":452,"userName":12,"url":12,"icon":450,"oldIcon":451},{"platformName":456,"userName":12,"url":12,"icon":454,"oldIcon":455},{"platformName":458,"userName":12,"url":12,"icon":414,"oldIcon":415},{"id":1609,"title":1610,"firstName":1611,"lastName":1612,"image":1613,"sport":1617,"positionShort":-1,"call_to_action":-1,"bio":1618,"twitter":18,"images":12,"displayFields":1619,"latestBioId":1609,"email":1620,"phone":18,"url":12,"staffId":1621,"socialMediaR":1622,"custom1":18,"custom2":18,"custom3":18,"custom4":18},2097,"Director of Catching & Assistant Player Development","Logan","Blackmon",{"altText":1614,"url":1615,"absoluteUrl":1616,"creditName":12,"mediaCaption":12,"title":12},"Logan Blackmon","\u002Fimages\u002F2023\u002F2\u002F2\u002F20230201-BSB_Head_Shots-19.jpg","https:\u002F\u002Ftroytrojans.com\u002Fimages\u002F2023\u002F2\u002F2\u002F20230201-BSB_Head_Shots-19.jpg",{"id":166,"title":112,"shortDisplay":163,"shortName":167,"abbrev":163,"facebookPage":-1,"globalSportGender":165,"globalSportId":166,"globalSportShortName":-1,"globalSportNameSlug":167,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Logan Blackmon was elevated to Director of Catching & Assistant Player Development ahead of the 2026 season, following three seasons on the Troy coaching staff as a graduate assistant.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuring his time with the Trojans, Troy has won 37-plus games for three straight seasons for the first time since 1996-98, including an NCAA Regional appearance in 2023. Catcher Brooks Bryan was an All-Sun Belt selection in back-to-back seasons in 2024 and 2025 before being drafted in the eighth round of the 2025 MLB Draft by the Kansas City Royals. Additionally, Clay Stearns emerged as one of the top defensive backstops in the Sun Belt, ranking second in the conference in framing runs saved in 2023. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAs a player, the Cantonment, Fla., native played two seasons at Pensacola State (2018-19), earning All-Panhandle Conference honors as a sophomore. Blackmon was a catcher at Troy in 2021 before kickstarting his coaching career as a student assistant in 2022. \u003Cbr \u002F>\r\n ",{"staff_title":1532,"staff_email":1533,"staff_phone":1534,"staff_twitter":-1},"lblackmon182778@troy.edu",758,[1623,1626,1627,1628,1629,1630,1631,1632,1633,1634,1635,1636],{"platformName":416,"userName":1624,"url":1625,"icon":414,"oldIcon":415},"LoganBlackmon13","https:\u002F\u002Ftwitter.com\u002FLoganBlackmon13",{"platformName":420,"userName":12,"url":12,"icon":418,"oldIcon":419 3Ch1>\u003Cspan style=\"font-family:tahoma;\">\u003Cstrong> The Pinkham File\u003C\u002Fstrong>\u003C\u002Fspan>\u003C\u002Fh1>\r\n\r\n\u003Ctable class=\"sidearm-table g-mb-20\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Personal Information\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Birthday\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>July 11\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Hometown\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Elizabethtown, Ky.\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Education\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville, 2019 (Bachelor's)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Playing Career\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville 2016-19\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Wife\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Erin\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Children\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Sammie\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Ctable class=\"sidearm-table\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Coaching History\u003Cbr \u002F>\r\n\t\t\t \u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2026-pres.\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy  -\u003Cbr \u002F>\r\n\t\t\tRecruiting Coordinator\u002FAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2024-2026\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Kent State -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u002FRecruiting Coordinator\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2020-2024\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia Tech  -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2019-20\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Louisville  -\u003Cbr \u002F>\r\n\t\t\tGraduate Assistant Coach \u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"text-align: justify;\">\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{13}\" paraid=\"303127068\">Zeke Pinkham joins the Trojans staff as the program's recruiting coordinator\u002Fassistant coach ahead of the 2027 season.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nNow entering his third coaching role, Pinkham joins the Trojans staff following a two-year stint with Kent State, where he worked with the team's hitters and catchers. The Golden Flashes went a combined 80-33 during Pinkham’s time with the program.  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{19}\" paraid=\"864937526\">Prior to Kent State, Pinkham began his coaching career at Georgia Tech during the 2020-21 season. In his four years with the program, the Yellow Jackets made three NCAA tournament appearances and captured the ACC Coastal Division title.  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{25}\" paraid=\"1138238208\">During his time in Atlanta, Pinkham mentored 18 MLB draft picks highlighted by the 2022 Buster Posey Award winner, Kevin Parada, who was drafted 11th overall by the New York Mets. Out of the 18 players drafted during his time, 15 were selected in the top 10 rounds, and two have gone on to make their MLB debuts (Justyn Henry-Malloy and Brant Hurter).\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{31}\" paraid=\"680037198\">Pinkham carved out a successful playing career before transitioning into coaching. As a three-year starting catcher for Louisville, he helped lead the Cardinals to two College World Series appearances (2017, 2019). His senior season saw him post a .324 batting across 33 starts, earn NCAA All-Louisville Regional Team honors, and lead Louisville to its highest finish in program history. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{37}\" paraid=\"1362989200\">A year later, Pinkham returned to Louisville as a graduate assistant coach, where he played a significant role in the development of No.1 overall draft pick Henry Davis and second-round draft pick Dalton Rushing. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{43}\" paraid=\"1240905563\">A native of Elizabethtown, Ky., Pinkham earned his bachelor’s degree in sports administration from the University of Louisville. \u003C\u002Fp>\r\n\u003C\u002Fdiv>\r\n",{"staff_title":1532,"staff_email":1533,"staff_phone":1534,"staff_twitter":416},817,[1650,1653,1654,1655,1656,1657,1658,1659,1660,1661,1662,1663],{"platformName":416,"userName":1651,"url":1652,"icon":414,"oldIcon":415},"zpink11","https:\u002F\u002Ftwitter.com\u002Fzpink11",{"platformName":420,"userName":12,"url":12,"icon":418,"oldIcon":419},{"platformName":424,"userName":12,"url":12,"icon":422,"oldIcon":423},{"platformName":428,"userName":12,"url":12,"icon":426,"oldIcon":427},{"platformName":432,"userName":12,"url":12,"icon":430,"oldIcon":431},{"platformName":436,"userName":12,"url":12,"icon":434,"oldIcon":435},{"platformName":440,"userName":12,"url":12,"icon":438,"oldIcon":439},{"platformName":444,"userName":12,"url":12,"icon":442,"oldIcon":443},{"platformName":448,"userName":12,"url":12,"icon":446,"oldIcon":447},{"platformName":452,"userName":12,"url":12,"icon":450,"oldIcon":451},{"platformName":456,"userName":12,"url":12,"icon":454,"oldIcon":455},{"platformName":458,"userName":12,"url":12,"icon":414,"oldIcon":415},{"id":1665,"title":1666,"firstName":1667,"lastName":1668,"image":1669," u003Ctr>\r\n\t\t\t\u003Ctd>Playing Career\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Lurleen B. Wallace Community College, 2016\u003Cbr \u002F>\r\n\t\t\tCentral Alabama Community College, 2017\u003Cbr \u002F>\r\n\t\t\tTroy University, 2018-19\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Ctable class=\"sidearm-table\">\r\n\t\u003Cthead class=\"sidearm-primary\">\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"2\" style=\"text-align: left\">Coaching History\u003Cbr \u002F>\r\n\t\t\t \u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2026-pres.\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy  -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2022-2026\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Chipola College -\u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2020-22\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Pike Liberal Arts School  -\u003Cbr \u002F>\r\n\t\t\tHead Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2020\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy -\u003Cbr \u002F>\r\n\t\t\tStudent Assistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy Post 70 -\u003Cbr \u002F>\r\n\t\t\tHead Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Troy Post 70 - \u003Cbr \u002F>\r\n\t\t\tAssistant Coach\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"text-align: justify;\">\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{154}\" paraid=\"1511314763\">Rush Hixon was announced as an assistant coach for the Trojans baseball program in August of 2026.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHixon returns to his alma mater following a five-year stint at Chipola College, where he served as the pitching coach and recruiting coordinator. Last season with the Indians, Hixon helped lead his team to a 45-13 record and an FCSAA\u002FRegion VIII runner-up finish. His pitching staff recorded the most wins (45) across the National Junior College Athletic Association Division I. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{160}\" paraid=\"1380493692\">During his time at Chipola, Hixon also helped develop two Major League Baseball draft selections, including JeanPierre Ortiz, who was selected in the 17th round by the Cincinnati Reds, and Lucas Elissalt, who was selected in the 13th round by the Detroit Tigers. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{166}\" paraid=\"427222132\">Prior to Chipola, Hixon spent two seasons as the head baseball coach at Pike Liberal Arts School in Troy, leading the Patriots to Alabama Independent School Association state championships in both seasons. His teams posted a combined record of 60-11 during his tenure at Pike Liberal. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{172}\" paraid=\"964961358\">He began his coaching career in 2016 with Troy Post 70, a summer travel baseball program of the American Legion. After serving one season as an assistant coach, he stepped into the head coaching role for the next five years. His six-year tenure with the club produced an Alabama state championship each season, 15 athletes that went on to play at the NCAA Division I level, and two who were drafted by MLB teams.  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{178}\" paraid=\"648718277\">Before coaching, Hixon started his playing career at Lurleen B. Wallace Community College, where he notched a 5-1 record across 34.1 innings. Prior to his second season, he transferred to Central Alabama Community College and received All-Region and All-Conference honors with a team-leading 8-1 record and 1.50 ERA. He topped off his sophomore campaign with an American Baseball Coaches Association\u002FRawlings NJCAA Division I Gold Glove award. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{184}\" paraid=\"58464825\">The native of Banks, Ala. played his final two years just down the road at Troy during the 2018 and 2019 seasons before returning for the 2020 season as a student assistant coach. In two seasons for the Trojans, Hixon made 50 appearances across 99.2 innings with an ERA of 4.06 and six saves and a 10-strikeout performance against Sun Belt foe Georgia State. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{190}\" paraid=\"483322261\">Hixon earned his bachelor’s degree in social science from Troy University.  \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{196}\" paraid=\"1354122009\">\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{152}\" paraid=\"1646110028\">\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3596809d-852a-478e-bd01-c34dc063b2de}{11}\" paraid=\"738692707\">\u003C\u002Fp>\r\n\u003C\u002Fdiv>\r\n",{"staff_title":1532,"staff_email":1533,"staff_phone":1534,"staff_twitter":-1},818,[1677,1680,1681,1682,1683,1684,1685,1686,1687,1688,1689,1690],{"platformName":416,"userName":1678,"url":1679,"icon":414,"oldIcon":415},"R_Hix22","https:\u002F\u002Ftwitter.com\u002FR_Hix22",{"platformName":420,"userName":12,"url":12,"icon":418,"oldIcon":419},{"platformName":424,"userName":12,"url":12,"icon":422,"oldIcon":423},{"platformName":428,"userName":12,"url":12,"icon":426,"oldIcon":427},{"platformName":432,"userName":12,"url":12,"icon":430,"oldIcon":431},{"platformName":436,"userName":12,"url":12,"icon":434,"oldIcon
